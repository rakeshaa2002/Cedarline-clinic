# Render Blueprint for full-stack deployment:
# 1. cedarline-api: Docker Web Service hosting the FastAPI Backend with pgvector RAG
# 2. cedarline-frontend: Static Site hosting the React Frontend Single Page App

services:
  # =========================================================================
  # 1. Backend Web Service (FastAPI + pgvector + RAG + Uvicorn)
  # =========================================================================
  - type: web
    name: cedarline-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # PostgreSQL connection string (Neon or Render Postgres, e.g. postgresql://user:pass@ep-xyz.neon.tech/clinic?sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # Comma-separated allowed frontend origins (e.g. https://cedarline-frontend.onrender.com)
      - key: ADMIN_EMAIL
        value: admin@cedarline.example
      - key: ADMIN_PASSWORD
        sync: false
      - key: STAFF_EMAIL
        value: staff@cedarline.example
      - key: STAFF_PASSWORD
        sync: false
      - key: DOCTOR_EMAIL
        value: doctor@cedarline.example
      - key: DOCTOR_PASSWORD
        sync: false
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: EMBEDDING_DIM
        value: "768"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_FALLBACK_MODELS
        value: gemini-flash-lite-latest
      - key: GEMINI_API_KEY
        sync: false
      - key: SEED_ON_START
        value: "true"
      - key: PUBLIC_SITE_URL
        value: https://cedarline-clinic.onrender.com # Frontend URL used in patient emails
      # Patient emails (optional). Without SMTP_HOST, emails are logged as "skipped" on each appointment.
      - key: SMTP_HOST
        sync: false # e.g. smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false # Gmail: a 16-character App Password
      # Image uploads (optional). Without these, images are stored in PostgreSQL.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # =========================================================================
  # 2. Frontend Web Service (Vite + React Static SPA)
  # =========================================================================
  - type: web
    name: cedarline-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Point to backend API: https://cedarline-api.onrender.com
      - key: VITE_SITE_URL
        sync: false # Frontend URL: https://cedarline-frontend.onrender.com
