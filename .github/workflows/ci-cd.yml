name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run oxlint linter
        run: npm run lint

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: ""
          VITE_SITE_URL: "https://cedarline-frontend.onrender.com"

  backend:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic_dev_password
          POSTGRES_DB: clinic_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify Python code compilation
        run: python -m compileall app

      - name: Run pytest test suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg://clinic:clinic_dev_password@localhost:5434/clinic_test
          ENVIRONMENT: test
        run: pytest

  deploy-render:
    name: Render Deployment
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render API Webhook (optional)
        if: env.RENDER_API_HOOK != ''
        env:
          RENDER_API_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render API deployment..."
          curl -f -X POST "$RENDER_API_HOOK"

      - name: Trigger Render Frontend Webhook (optional)
        if: env.RENDER_FRONTEND_HOOK != ''
        env:
          RENDER_FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          echo "Triggering Render Frontend deployment..."
          curl -f -X POST "$RENDER_FRONTEND_HOOK"

      - name: Deployment Status
        run: |
          echo "All CI validations passed successfully."
          echo "If Render is linked to your GitHub repository, Render automatically deploys branch 'main'."
